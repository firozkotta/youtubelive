<!DOCTYPE html>
<html>
<head>
    <title>Malayalam News Live Wall</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://www.youtube.com/embed/s0LLVQeMmtU" allowfullscreen></iframe>
    
    <iframe src="https://www.youtube.com/embed/1wECsnGZcfc" allowfullscreen></iframe>
    
    <iframe src="https://www.youtube.com/embed/yiiqRHY1Bl8" allowfullscreen></iframe>
    
    <iframe src="https://www.youtube.com/embed/-8d8-c0yvyU" allowfullscreen></iframe>
    
    <iframe src="https://www.youtube.com/embed/tgBTspqA5nY" allowfullscreen></iframe>    
    
    <iframe src="https://www.youtube.com/embed/YGEgelAiUf0" allowfullscreen></iframe>
</body>
</html>
